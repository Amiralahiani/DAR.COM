<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/chatbot/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="/chatbot/logo192.png" />
    <link rel="manifest" href="/chatbot/manifest.json" />
    <title>React App</title>
    <script defer="defer" src="/chatbot/static/js/main.823c50ac.js"></script>
    <link href="/chatbot/static/css/main.03de633b.css" rel="stylesheet" />
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        document.addEventListener("click", function (event) {
            const anchor = event.target?.closest?.("a[href]");
            if (!anchor) return;

            const href = anchor.getAttribute("href");
            if (!href) return;
            if (href.startsWith("#") || href.toLowerCase().startsWith("javascript:")) return;

            event.preventDefault();
            window.open(href, "_blank", "noopener,noreferrer");
        }, true);
    </script>
</body>
</html>
